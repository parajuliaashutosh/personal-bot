[project]
name = "personal-rag-api"
version = "0.1.0"
description = "Production-grade RAG API — PDF ingestion + natural language retrieval"
requires-python = ">=3.11"

dependencies = [
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "asyncpg>=0.30.0",
  "pymupdf>=1.24.0",
  "pydantic-settings>=2.3.0",
  "sse-starlette>=2.1.0",
  "httpx>=0.27.0",
  "langdetect>=1.0.9",
  "slowapi>=0.1.9",
  "pyjwt>=2.15.1",
  "bcrypt>=4.2.0",
]

[project.scripts]
seed-admin = "scripts.seed_admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingestion", "retrieval", "scripts", "shared"]
