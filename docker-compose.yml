services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-personal_chatbot}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-personal_chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: rag-app
    ports:
      - "8000:8000"
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-personal_chatbot}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-deepseek-chat}
      EMBED_MODEL: ${EMBED_MODEL:-openai/text-embedding-3-small}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-768}
      API_KEY: ${API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-15}
      REFRESH_EXPIRE_DAYS: ${REFRESH_EXPIRE_DAYS:-7}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      IPINFO_API_KEY: ${IPINFO_API_KEY:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      MAX_PAGES: ${MAX_PAGES:-500}
      data_dir: data
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-20}
      CONTEXT_TOKEN_LIMIT: ${CONTEXT_TOKEN_LIMIT:-3000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
